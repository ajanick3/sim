# This crate is the engine. A bare `cargo` command at the root builds and
# tests only the engine, because `default-members` names this package alone.
# The browser front end lives in `crates/sim-wasm`, added as a member when it
# arrives, and is built on request.
[workspace]
members = [".", "crates/sim-wasm"]
default-members = ["."]

[package]
name = "sim"
version = "0.1.0"
edition = "2024"
# `cargo run` plays a game. The other binaries measure things.
default-run = "sim"

[dependencies]
serde_json = "1.0.151"
